[theme]
base = "dark"
primaryColor = "#39DCDC"
backgroundColor = "#05070D"
secondaryBackgroundColor = "#0A0F1A"
textColor = "#E6ECF7"

[server]
headless = true
fileWatcherType = "auto"

[client]
# Hide Streamlit's own developer toolbar — the Deploy button in particular,
# which offers to publish to Streamlit Cloud and fails confusingly when the
# code is not in a GitHub repo.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
